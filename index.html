<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Air Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; color: white; overflow: hidden; }
    #container { position: relative; width: 800px; height: 600px; border-radius: 16px; overflow: hidden; box-shadow: 0 0 40px rgba(0,255,180,0.2); }
    #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #status { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 6px 18px; border-radius: 20px; font-size: 13px; color: #aaa; white-space: nowrap; }
    #mode-badge { position: absolute; top: 16px; left: 16px; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; background: rgba(0,220,100,0.2); color: #00dc64; border: 1px solid #00dc64; transition: all 0.2s; }
    #mode-badge.erase { background: rgba(255,60,60,0.2); color: #ff3c3c; border-color: #ff3c3c; }
    #swatch { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: 3px solid white; transition: background 0.2s; }
    #toolbar { display: flex; gap: 12px; margin-top: 16px; }
    .btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px 22px; border-radius: 10px; cursor: pointer; font-family: monospace; font-size: 14px; transition: all 0.15s; }
    .btn:hover { background: #2a2a2a; border-color: #555; }
    .color-btn { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.15s; }
    .color-btn:hover, .color-btn.active { transform: scale(1.25); border-color: white; }
    #colors { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    #brush-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; color: #888; }
    #brush-slider { accent-color: #00dc64; width: 100px; }
    #loading { position: fixed; inset: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 99; }
    #loading p { color: #aaa; font-size: 14px; }
    #loading small { color: #555; font-size: 12px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #222; border-top-color: #00dc64; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p id="load-msg">Loading MediaPipe…</p>
  <small>First load may take 10–20 seconds</small>
</div>

<div id="container">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <canvas id="hud"></canvas>
  <div id="status">☝️ 1 finger = draw &nbsp;|&nbsp; ✌️ 2 fingers = erase</div>
  <div id="mode-badge">DRAW</div>
  <div id="swatch"></div>
</div>

<div id="toolbar">
  <button class="btn" onclick="clearCanvas()">🗑 Clear</button>
  <button class="btn" onclick="saveCanvas()">💾 Save</button>
  <button class="btn" onclick="toggleMirror()">🪞 Mirror</button>
</div>

<div id="colors"></div>

<div id="brush-row">
  Brush size: <input id="brush-slider" type="range" min="4" max="40" value="10" oninput="brushSize=+this.value">
</div>

<script type="module">
// ── import MediaPipe from esm.sh (most reliable CDN) ──────────────────────
import { FilesetResolver, HandLandmarker }
  from "https://esm.sh/@mediapipe/tasks-vision@0.10.14";

// ── state ──────────────────────────────────────────────────────────────────
const COLORS = ['#00ffb4','#ff5000','#008cff','#ff00b4','#ffff00','#ffffff','#ff4444'];
let colorIdx  = 0;
let brushSize = 10;
let mirrored  = true;
let prevPt    = null;
let erasing   = false;
let handLandmarker = null;
let lastVideoTime  = -1;

// ── DOM ────────────────────────────────────────────────────────────────────
const video     = document.getElementById('webcam');
const canvas    = document.getElementById('canvas');
const hud       = document.getElementById('hud');
const ctx       = canvas.getContext('2d');
const hctx      = hud.getContext('2d');
const modeBadge = document.getElementById('mode-badge');
const swatch    = document.getElementById('swatch');
const loading   = document.getElementById('loading');
const loadMsg   = document.getElementById('load-msg');

// ── colour buttons ─────────────────────────────────────────────────────────
const colorsDiv = document.getElementById('colors');
COLORS.forEach((c, i) => {
  const b = document.createElement('div');
  b.className = 'color-btn' + (i === 0 ? ' active' : '');
  b.style.background = c;
  b.onclick = () => {
    colorIdx = i;
    document.querySelectorAll('.color-btn').forEach((el,j) =>
      el.classList.toggle('active', j === i));
    swatch.style.background = COLORS[colorIdx];
  };
  colorsDiv.appendChild(b);
});
swatch.style.background = COLORS[0];

// ── resize canvases to match video ────────────────────────────────────────
function resizeCanvases() {
  const W = video.videoWidth  || 800;
  const H = video.videoHeight || 600;
  [canvas, hud].forEach(c => { c.width = W; c.height = H; });
}

// ── finger count ──────────────────────────────────────────────────────────
function fingersUp(lm) {
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  return tips.reduce((n, tip, i) => n + (lm[tip].y < lm[pips[i]].y ? 1 : 0), 0);
}

// ── landmark → pixel ──────────────────────────────────────────────────────
function lmPx(lm, idx) {
  const x = mirrored ? (1 - lm[idx].x) * canvas.width : lm[idx].x * canvas.width;
  const y = lm[idx].y * canvas.height;
  return [x, y];
}

// ── smoothing ─────────────────────────────────────────────────────────────
const BUF = [];
function smooth(x, y) {
  BUF.push([x, y]);
  if (BUF.length > 5) BUF.shift();
  return [
    BUF.reduce((s,p) => s + p[0], 0) / BUF.length,
    BUF.reduce((s,p) => s + p[1], 0) / BUF.length,
  ];
}

// ── draw on canvas ────────────────────────────────────────────────────────
function drawStroke(x, y) {
  if (erasing) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, brushSize * 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fill();
    ctx.restore();
    prevPt = null;
    return;
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = COLORS[colorIdx];
  ctx.lineWidth   = brushSize * 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  if (prevPt) {
    ctx.beginPath();
    ctx.moveTo(prevPt[0], prevPt[1]);
    ctx.lineTo(x, y);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(x, y, brushSize, 0, Math.PI * 2);
  ctx.fillStyle = COLORS[colorIdx];
  ctx.fill();
  prevPt = [x, y];
}

// ── HUD skeleton + cursor ─────────────────────────────────────────────────
function drawHUD(lm, x, y) {
  hctx.clearRect(0, 0, hud.width, hud.height);
  const CONNS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];
  hctx.strokeStyle = 'rgba(255,255,255,0.2)';
  hctx.lineWidth   = 1.5;
  CONNS.forEach(([a,b]) => {
    const [ax,ay] = lmPx(lm, a);
    const [bx,by] = lmPx(lm, b);
    hctx.beginPath();
    hctx.moveTo(ax, ay);
    hctx.lineTo(bx, by);
    hctx.stroke();
  });
  if (erasing) {
    hctx.strokeStyle = '#ff3c3c';
    hctx.lineWidth   = 2;
    hctx.beginPath();
    hctx.arc(x, y, brushSize * 3, 0, Math.PI * 2);
    hctx.stroke();
  } else {
    hctx.fillStyle   = COLORS[colorIdx];
    hctx.shadowColor = COLORS[colorIdx];
    hctx.shadowBlur  = 14;
    hctx.beginPath();
    hctx.arc(x, y, brushSize + 4, 0, Math.PI * 2);
    hctx.fill();
    hctx.shadowBlur  = 0;
  }
}

// ── detection loop ─────────────────────────────────────────────────────────
function detect() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result  = handLandmarker.detectForVideo(video, performance.now());

    hctx.clearRect(0, 0, hud.width, hud.height);

    if (result.landmarks && result.landmarks.length > 0) {
      const lm  = result.landmarks[0];
      const nUp = fingersUp(lm);
      erasing   = nUp >= 2;

      modeBadge.textContent = erasing ? 'ERASE' : 'DRAW';
      modeBadge.className   = erasing ? 'erase' : '';

      const [rx, ry] = lmPx(lm, 8);
      const [sx, sy] = smooth(rx, ry);

      drawStroke(sx, sy);
      drawHUD(lm, sx, sy);
    } else {
      prevPt = null;
      BUF.length = 0;
    }
  }
  requestAnimationFrame(detect);
}

// ── toolbar ────────────────────────────────────────────────────────────────
window.clearCanvas = () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  prevPt = null;
};

window.saveCanvas = () => {
  const tmp = document.createElement('canvas');
  tmp.width  = canvas.width;
  tmp.height = canvas.height;
  const tc   = tmp.getContext('2d');
  tc.save();
  if (mirrored) { tc.translate(tmp.width, 0); tc.scale(-1, 1); }
  tc.drawImage(video, 0, 0, tmp.width, tmp.height);
  tc.restore();
  tc.drawImage(canvas, 0, 0);
  const a    = document.createElement('a');
  a.download = `air-canvas-${Date.now()}.png`;
  a.href     = tmp.toDataURL();
  a.click();
};

window.toggleMirror = () => {
  mirrored = !mirrored;
  video.style.transform = mirrored ? 'scaleX(-1)' : 'none';
};

// ── init ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    loadMsg.textContent = 'Loading WASM files…';
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    loadMsg.textContent = 'Loading hand model…';
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numHands: 1,
      minHandDetectionConfidence: 0.7,
      minHandPresenceConfidence:  0.6,
      minTrackingConfidence:      0.6,
    });

    loadMsg.textContent = 'Starting camera…';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: 'user' }
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    await video.play();
    resizeCanvases();

    loading.style.display = 'none';
    detect();

  } catch (err) {
    loading.innerHTML = `
      <p style="color:#ff4444; font-size:16px">❌ Error</p>
      <p style="color:#aaa; font-size:13px; max-width:400px; text-align:center">${err.message}</p>
      <small style="color:#555">Check browser console for details (F12)</small>
    `;
    console.error(err);
  }
}

init();
</script>
</body>
</html>
