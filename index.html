<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Air Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: white; overflow: hidden; }
    #container { position: relative; width: 800px; height: 600px; border-radius: 16px; overflow: hidden; box-shadow: 0 0 40px rgba(0,255,180,0.2); }
    #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #status { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 6px 18px; border-radius: 20px; font-size: 13px; color: #aaa; white-space: nowrap; }
    #mode-badge { position: absolute; top: 16px; left: 16px; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; background: rgba(0,220,100,0.2); color: #00dc64; border: 1px solid #00dc64; transition: all 0.2s; }
    #mode-badge.erase { background: rgba(255,60,60,0.2); color: #ff3c3c; border-color: #ff3c3c; }
    #swatch { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: 3px solid white; transition: background 0.2s; }
    #toolbar { display: flex; gap: 12px; margin-top: 16px; }
    .btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px 22px; border-radius: 10px; cursor: pointer; font-family: monospace; font-size: 14px; transition: all 0.15s; }
    .btn:hover { background: #2a2a2a; border-color: #555; }
    .btn.active { border-color: #00dc64; color: #00dc64; }
    .color-btn { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.15s; }
    .color-btn:hover, .color-btn.active { transform: scale(1.25); border-color: white; }
    #colors { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    #brush-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; color: #888; }
    #brush-slider { accent-color: #00dc64; width: 100px; }
    #loading { position: fixed; inset: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 99; }
    #loading p { color: #555; font-size: 14px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #222; border-top-color: #00dc64; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading MediaPipe…</p>
</div>

<div id="container">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <canvas id="hud"></canvas>
  <div id="status">☝️ 1 finger = draw &nbsp;|&nbsp; ✌️ 2 fingers = erase</div>
  <div id="mode-badge">DRAW</div>
  <div id="swatch"></div>
</div>

<div id="toolbar">
  <button class="btn" onclick="clearCanvas()">🗑 Clear</button>
  <button class="btn" onclick="saveCanvas()">💾 Save</button>
  <button class="btn" id="camBtn" onclick="toggleMirror()">🪞 Mirror</button>
</div>

<div id="colors"></div>

<div id="brush-row">
  Brush size: <input id="brush-slider" type="range" min="4" max="40" value="10" oninput="brushSize=+this.value">
</div>

<!-- MediaPipe via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>

<script>
const { HandLandmarker, FilesetResolver } = window;

// ── state ──────────────────────────────────────────────────────────────────
const COLORS = ['#00ffb4','#ff5000','#008cff','#ff00b4','#ffff00','#ffffff','#ff4444'];
let colorIdx  = 0;
let brushSize = 10;
let mirrored  = true;
let prevPt    = null;
let erasing   = false;
let handLandmarker = null;
let lastVideoTime  = -1;

// ── DOM ────────────────────────────────────────────────────────────────────
const video    = document.getElementById('webcam');
const canvas   = document.getElementById('canvas');
const hud      = document.getElementById('hud');
const ctx      = canvas.getContext('2d');
const hctx     = hud.getContext('2d');
const modeBadge = document.getElementById('mode-badge');
const swatch    = document.getElementById('swatch');
const loading   = document.getElementById('loading');

// ── colour buttons ─────────────────────────────────────────────────────────
const colorsDiv = document.getElementById('colors');
COLORS.forEach((c, i) => {
  const b = document.createElement('div');
  b.className = 'color-btn' + (i === 0 ? ' active' : '');
  b.style.background = c;
  b.onclick = () => {
    colorIdx = i;
    document.querySelectorAll('.color-btn').forEach((el,j) =>
      el.classList.toggle('active', j === i));
    updateSwatch();
  };
  colorsDiv.appendChild(b);
});

function updateSwatch() {
  swatch.style.background = COLORS[colorIdx];
}
updateSwatch();

// ── canvas resize ──────────────────────────────────────────────────────────
function resizeCanvases() {
  const W = video.videoWidth  || 800;
  const H = video.videoHeight || 600;
  [canvas, hud].forEach(c => { c.width = W; c.height = H; });
}

// ── helpers ────────────────────────────────────────────────────────────────
function fingersUp(lm) {
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  return tips.reduce((n, tip, i) => n + (lm[tip].y < lm[pips[i]].y ? 1 : 0), 0);
}

function lmToPixel(lm, idx) {
  // video is CSS-mirrored; landmark x is already from the real camera,
  // so we flip x to match the mirrored display
  const x = mirrored ? (1 - lm[idx].x) * canvas.width : lm[idx].x * canvas.width;
  const y = lm[idx].y * canvas.height;
  return [x, y];
}

// smooth buffer
const BUF = [];
const BUF_SIZE = 5;
function smooth(x, y) {
  BUF.push([x, y]);
  if (BUF.length > BUF_SIZE) BUF.shift();
  return [
    BUF.reduce((s,p)=>s+p[0],0)/BUF.length,
    BUF.reduce((s,p)=>s+p[1],0)/BUF.length,
  ];
}

// ── draw ───────────────────────────────────────────────────────────────────
function drawStroke(x, y) {
  if (erasing) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, brushSize * 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fill();
    ctx.restore();
    prevPt = null;
    return;
  }
  ctx.strokeStyle = COLORS[colorIdx];
  ctx.lineWidth   = brushSize * 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.globalCompositeOperation = 'source-over';
  if (prevPt) {
    ctx.beginPath();
    ctx.moveTo(prevPt[0], prevPt[1]);
    ctx.lineTo(x, y);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(x, y, brushSize, 0, Math.PI * 2);
  ctx.fillStyle = COLORS[colorIdx];
  ctx.fill();
  prevPt = [x, y];
}

// ── HUD overlay ────────────────────────────────────────────────────────────
function drawHUD(lm, x, y) {
  hctx.clearRect(0, 0, hud.width, hud.height);

  // skeleton connections
  const CONNS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];
  hctx.strokeStyle = 'rgba(255,255,255,0.25)';
  hctx.lineWidth   = 1.5;
  CONNS.forEach(([a,b]) => {
    const [ax,ay] = lmToPixel(lm, a);
    const [bx,by] = lmToPixel(lm, b);
    hctx.beginPath();
    hctx.moveTo(ax,ay);
    hctx.lineTo(bx,by);
    hctx.stroke();
  });

  // fingertip cursor
  if (erasing) {
    hctx.strokeStyle = '#ff3c3c';
    hctx.lineWidth   = 2;
    hctx.beginPath();
    hctx.arc(x, y, brushSize * 3, 0, Math.PI * 2);
    hctx.stroke();
  } else {
    hctx.fillStyle = COLORS[colorIdx];
    hctx.shadowColor = COLORS[colorIdx];
    hctx.shadowBlur  = 12;
    hctx.beginPath();
    hctx.arc(x, y, brushSize + 4, 0, Math.PI * 2);
    hctx.fill();
    hctx.shadowBlur = 0;
  }
}

// ── detection loop ─────────────────────────────────────────────────────────
function detect() {
  if (video.readyState < 2) { requestAnimationFrame(detect); return; }

  const now = performance.now();
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result  = handLandmarker.detectForVideo(video, now);

    hctx.clearRect(0, 0, hud.width, hud.height);

    if (result.landmarks && result.landmarks.length > 0) {
      const lm    = result.landmarks[0];
      const nUp   = fingersUp(lm);
      erasing     = nUp >= 2;

      modeBadge.textContent = erasing ? 'ERASE' : 'DRAW';
      modeBadge.className   = 'mode-badge' + (erasing ? ' erase' : '');

      const [rx, ry]  = lmToPixel(lm, 8);
      const [sx, sy]  = smooth(rx, ry);

      drawStroke(sx, sy);
      drawHUD(lm, sx, sy);
    } else {
      prevPt = null;
      BUF.length = 0;
    }
  }

  requestAnimationFrame(detect);
}

// ── toolbar actions ────────────────────────────────────────────────────────
function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  prevPt = null;
}

function saveCanvas() {
  // merge webcam frame + drawing
  const tmp  = document.createElement('canvas');
  tmp.width  = canvas.width;
  tmp.height = canvas.height;
  const tc   = tmp.getContext('2d');
  tc.save();
  if (mirrored) { tc.translate(tmp.width, 0); tc.scale(-1, 1); }
  tc.drawImage(video, 0, 0, tmp.width, tmp.height);
  tc.restore();
  tc.drawImage(canvas, 0, 0);
  const a    = document.createElement('a');
  a.download = `air-canvas-${Date.now()}.png`;
  a.href     = tmp.toDataURL();
  a.click();
}

function toggleMirror() {
  mirrored = !mirrored;
  video.style.transform = mirrored ? 'scaleX(-1)' : 'scaleX(1)';
}

// ── init ───────────────────────────────────────────────────────────────────
async function init() {
  // load MediaPipe
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.7,
    minHandPresenceConfidence:  0.6,
    minTrackingConfidence:      0.6,
  });

  // camera
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 1280, height: 720, facingMode: 'user' }
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  await video.play();
  resizeCanvases();

  loading.style.display = 'none';
  detect();
}

init().catch(err => {
  loading.innerHTML = `<p style="color:#ff4444">Error: ${err.message}</p>`;
  console.error(err);
});
</script>
</body>
</html>
